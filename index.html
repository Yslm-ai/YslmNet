<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Koder — Блог о разработке</title>
    <meta name="description" content="Новости и обзоры из мира IT. Что нового на канале?">

    <style>
        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'TildaSans', sans-serif;
            background-color: #000000;
            margin: 0;
            scroll-behavior: smooth;
        }

        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes matrixGlow {
            0% {
                text-shadow: 0 0 2px #14ff00, 0 0 5px #14ff00;
            }
            100% {
                text-shadow: 0 0 8px #14ff00, 0 0 15px #14ff00;
            }
        }

        @keyframes arrowBounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(8px);
            }
        }

        .animate-on-scroll {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        .animate-on-scroll.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* ===== HEADER ===== */
        .header {
            background-color: #000000;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(20, 255, 0, 0.3);
        }

        .header__container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 48px;
            font-weight: 700;
            color: #14ff00;
            text-decoration: none;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            animation: matrixGlow 1.5s ease-in-out infinite alternate;
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-link {
            color: #14ff00;
            font-size: 18px;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 5px 0;
            border-bottom: 2px solid transparent;
        }

        .nav-link:hover {
            border-bottom-color: #14ff00;
            transform: translateY(-2px);
        }

        /* ===== HERO ===== */
        .hero {
            background: linear-gradient(135deg, #0a0f0a 0%, #051505 50%, #000000 100%);
            position: relative;
            min-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 20px;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('matrix-code.gif');
            background-repeat: repeat;
            opacity: 0.15;
            pointer-events: none;
        }

        .hero__content {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .hero__uptitle {
            color: #14ff00;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .hero__title {
            color: #14ff00;
            font-size: 64px;
            font-weight: 700;
            margin-bottom: 20px;
            animation: fadeInUp 0.8s ease;
        }

        .hero__descr {
            color: #14ff00;
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 40px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn--primary {
            background-color: #14ff00;
            color: #000000;
            box-shadow: 0 4px 15px rgba(20, 255, 0, 0.3);
        }

        .btn--primary:hover {
            background-color: #0fcc00;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(20, 255, 0, 0.4);
        }

        .btn--secondary {
            background-color: transparent;
            color: #14ff00;
            border: 2px solid #14ff00;
        }

        .btn--secondary:hover {
            background-color: rgba(20, 255, 0, 0.1);
            transform: translateY(-3px);
        }

        .hero__arrow {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            cursor: pointer;
            transition: all 0.3s ease;
            animation: arrowBounce 1.5s infinite;
        }

        .hero__arrow svg {
            fill: #14ff00;
            width: 38px;
            height: 19px;
        }

        /* ===== POST FEED ===== */
        .feed-wrapper {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .feed-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 25px;
            background: #111111;
            border: 1px solid #222222;
            border-radius: 12px 12px 0 0;
            cursor: pointer;
            transition: all 0.3s ease;
            user-select: none;
        }

        .feed-header:hover {
            background: rgba(20, 255, 0, 0.05);
            border-color: #14ff00;
        }

        .feed-header h2 {
            color: #14ff00;
            font-size: 24px;
            font-weight: 600;
        }

        .feed-header .post-count {
            color: #666;
            font-size: 14px;
            font-weight: 400;
        }

        .feed-toggle {
            color: #14ff00;
            font-size: 28px;
            font-weight: 300;
            transition: transform 0.3s ease;
            min-width: 30px;
            text-align: center;
        }

        .feed-toggle.expanded {
            transform: rotate(180deg);
        }

        #telegram-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 0;
            max-height: 10000px;
            overflow: hidden;
            transition: max-height 0.5s ease, padding 0.4s ease, opacity 0.3s ease;
            opacity: 1;
        }

        #telegram-feed.collapsed {
            max-height: 0 !important;
            padding: 0 !important;
            opacity: 0;
        }

        .feed-body {
            background: #111111;
            border: 1px solid #222222;
            border-top: none;
            border-radius: 0 0 12px 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .feed-body.collapsed {
            border: 1px solid #222222;
            border-radius: 12px;
        }

        .post-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 8px;
            padding: 20px 25px;
            margin: 0 10px;
            box-shadow: 0 2px 10px rgba(20, 255, 0, 0.03);
            line-height: 1.6;
            color: #dddddd;
            white-space: pre-wrap;
            transition: all 0.2s ease;
        }

        .post-card:hover {
            border-color: #14ff00;
            transform: translateY(-2px);
        }

        .post-card:last-child {
            margin-bottom: 5px;
        }

        .loading-text {
            text-align: center;
            color: #666666;
            font-size: 1.2rem;
            padding: 40px;
        }

        /* ===== ABOUT & REVIEWS ===== */
        .section-block {
            background-color: #000000;
            padding: 60px 20px;
            text-align: center;
            border-top: 1px solid rgba(20, 255, 0, 0.2);
        }

        .section-block__inner {
            max-width: 800px;
            margin: 0 auto;
        }

        .section-title {
            color: #14ff00;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .section-text {
            color: #cccccc;
            font-size: 18px;
            line-height: 1.6;
        }

        /* ===== FOOTER ===== */
        .footer-section {
            background: linear-gradient(180deg, #000000 0%, #0a1a0a 100%);
            padding: 60px 20px 40px;
            text-align: center;
            border-top: 1px solid rgba(20, 255, 0, 0.2);
        }

        .footer-section__content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .footer-title {
            color: #14ff00;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .footer-dino {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .footer-dino img {
            width: 100px;
            height: auto;
            filter: drop-shadow(0 0 8px #14ff00);
            transition: transform 0.3s ease;
        }

        .footer-dino img:hover {
            transform: scale(1.05);
        }

        .btn-to-top {
            background-color: #14ff00;
            color: #000000;
            border: none;
            padding: 14px 40px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(20, 255, 0, 0.3);
            margin-top: 20px;
        }

        .btn-to-top:hover {
            background-color: #0fcc00;
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 30px rgba(20, 255, 0, 0.5);
        }

        .btn-to-top:active {
            transform: translateY(2px);
        }

        .copyright {
            color: rgba(20, 255, 0, 0.5);
            margin-top: 50px;
            font-size: 14px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header__container {
                flex-direction: column;
                text-align: center;
            }

            .hero__title {
                font-size: 40px;
            }

            .hero__descr {
                font-size: 18px;
            }

            .footer-title {
                font-size: 32px;
            }

            .btn-to-top {
                font-size: 22px;
                padding: 12px 30px;
            }

            .logo {
                font-size: 36px;
            }

            .feed-header h2 {
                font-size: 20px;
            }

            .post-card {
                padding: 15px 18px;
                margin: 0 5px;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                gap: 20px;
            }

            .hero__title {
                font-size: 32px;
            }

            .btn {
                padding: 10px 24px;
                font-size: 14px;
            }

            .feed-header {
                padding: 15px 18px;
            }

            .feed-header h2 {
                font-size: 17px;
            }

            .post-card {
                padding: 12px 15px;
                font-size: 14px;
            }
        }

        /* ===== РАЗМЕТКА ВНУТРИ ПОСТОВ (posts.md) ===== */
        .post-date { color: #6b8f6b; font-size: 13px; margin-bottom: 8px; }
        .post-card a { color: #14ff00; }
        .post-card code { background: #151515; border: 1px solid #222; border-radius: 4px; padding: 0 5px; font-family: Consolas, monospace; }
        .post-card pre { background: #050505; border: 1px solid #222; border-radius: 6px; padding: 10px; margin: 8px 0; overflow-x: auto; white-space: pre; }
        .post-card pre code { background: none; border: 0; padding: 0; }
    </style>
</head>
<body>

    <div id="allrecords">

        <!-- HEADER -->
        <header class="header">
            <div class="header__container">
                <a href="#" class="logo" id="logoLink">Koder</a>
                <nav class="nav-links">
                    <a href="#about" class="nav-link">О влоге</a>
                    <a href="#reviews" class="nav-link">Отзывы</a>
                    <a href="#hero" class="nav-link">Канал</a>
                </nav>
            </div>
        </header>

        <!-- HERO -->
        <section class="hero" id="hero">
            <div class="hero__content">
                <div class="hero__uptitle animate-on-scroll">Новости за неделю</div>
                <h1 class="hero__title animate-on-scroll">Что нового?</h1>
                <p class="hero__descr animate-on-scroll">Что автор канала опять напридумывал?</p>
                <div class="buttons animate-on-scroll">
                    <a href="#about" class="btn btn--primary">О влоге</a>
                    <a href="https://t.me/kod_way" target="_blank" class="btn btn--secondary" rel="noopener noreferrer">Telegram</a>
                </div>
            </div>
            <div class="hero__arrow" id="scrollArrow">
                <svg viewBox="0 0 38.417 18.592">
                    <path d="M19.208,18.592c-0.241,0-0.483-0.087-0.673-0.261L0.327,1.74c-0.408-0.372-0.438-1.004-0.066-1.413c0.372-0.409,1.004-0.439,1.413-0.066L19.208,16.24L36.743,0.261c0.411-0.372,1.042-0.342,1.413,0.066c0.372,0.408,0.343,1.041-0.065,1.413L19.881,18.332C19.691,18.505,19.449,18.592,19.208,18.592z"/>
                </svg>
            </div>
        </section>

        <!-- TELEGRAM FEED -->
        <div class="feed-wrapper">
            <div class="feed-header" id="feedToggle">
                <div>
                    <h2>📰 Новости канала</h2>
                    <span class="post-count" id="postCount">Загрузка...</span>
                </div>
                <span class="feed-toggle expanded" id="feedToggleIcon">▼</span>
            </div>
            <div class="feed-body" id="feedBody">
                <div id="telegram-feed">
                    <div class="loading-text">Загрузка последних новостей с канала...</div>

        <!-- ABOUT -->
        <div class="section-block" id="about">
            <div class="section-block__inner animate-on-scroll">
                <h2 class="section-title">О блоге Koder</h2>
                <p class="section-text">Привет! Это блог о современных технологиях, разработке и всём, что связано с IT.</p>

        <!-- REVIEWS -->
        <div class="section-block" id="reviews">
            <div class="section-block__inner animate-on-scroll">
                <script src="https://forms.yandex.ru/_static/embed.js"></script>
                <iframe src="https://forms.yandex.ru/u/67dd1ba750569024833a544f?iframe=1" frameborder="0" name="ya-form-67dd1ba750569024833a544f" width="650"></iframe>
            </div>
        </div>

        <!-- FOOTER -->
        <footer class="footer-section" id="contact">
            <div class="footer-section__content">
                <div class="footer-title animate-on-scroll">Тёмный подвал</div>

                    <img src="dino.png" alt="dino icon">
                </div>
                <button class="btn-to-top" id="goToTopBtn">↑ Наверх</button>
            </div>

    </div>

    <script>
        (function() {

            // ===== API =====
            const POSTS_URL = 'posts.md';                                   // файл с постами в репозитории
            const USE_API_FALLBACK = false;                                  // true — при ошибке posts.md брать посты со старого API
            const API_URL = 'https://yslm.pythonanywhere.com/get-posts';

            // ===== Управление сворачиванием блока =====
            const feedToggle = document.getElementById('feedToggle');
            const feedBody = document.getElementById('feedBody');
            const feedContainer = document.getElementById('telegram-feed');
            const feedToggleIcon = document.getElementById('feedToggleIcon');
            let isFeedExpanded = true;

            feedToggle.addEventListener('click', function() {
                isFeedExpanded = !isFeedExpanded;
                feedContainer.classList.toggle('collapsed');
                feedBody.classList.toggle('collapsed');
                feedToggleIcon.classList.toggle('expanded');
                feedToggleIcon.textContent = isFeedExpanded ? '▼' : '▶';
            });

            // ===== Безопасная отрисовка Markdown из posts.md =====
            function renderMd(src) {
                var tokens = [];
                function stash(html) { tokens.push(html); return '\u0000' + (tokens.length - 1) + '\u0000'; }
                function esc(t) {
                    return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                }
                var lines = src.split('\n'), out = [], inCode = false, code = [];
                lines.forEach(function (line) {
                    if (/^```/.test(line)) {
                        if (inCode) { out.push(stash('<pre><code>' + esc(code.join('\n')) + '</code></pre>')); code = []; }
                        inCode = !inCode;
                        return;
                    }
                    if (inCode) { code.push(line); return; }
                    out.push(line);
                });
                if (inCode && code.length) out.push(stash('<pre><code>' + esc(code.join('\n')) + '</code></pre>'));

                var t = esc(out.join('\n'));
                t = t.replace(/\\([\\*`\[\]])/g, function (m, c) { return stash(c); });               // \* \` \[ \]
                t = t.replace(/`([^`\n]+)`/g, function (m, c) { return stash('<code>' + c + '</code>'); });
                t = t.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, function (m, label, url) {
                    return stash('<a href="' + url + '" target="_blank" rel="noopener noreferrer">' + label + '</a>');
                });
                t = t.replace(/\*\*([^*\n]+?)\*\*/g, '<strong>$1</strong>');
                t = t.replace(/\*([^*\n]+?)\*/g, '<em>$1</em>');
                for (var n = 0; n < 3; n++) {                                                       // токены могут быть вложены
                    t = t.replace(/\u0000(\d+)\u0000/g, function (m, i) { return tokens[+i]; });
                }
                return t;
            }

            // Разбор posts.md. Основной формат (его пишет update_posts.py):
            //   <!-- post:ID --> / ### дата / текст / ---
            // Если маркеров нет, файл читается как обычный список постов, разделённых строкой ---.
            function parsePosts(md) {
                md = md.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
                var parts = md.split(/<!--\s*post:(\d+)\s*-->/), posts = [];
                for (var i = 1; i < parts.length; i += 2) {
                    posts.push(makePost(+parts[i], parts[i + 1]));
                }
                if (!posts.length) {
                    var plain = md.replace(/<!--[\s\S]*?-->/g, '');
                    var blocks = plain.split(/\n[ \t]*---+[ \t]*(?:\n|$)/).map(function (b) { return b.trim(); }).filter(Boolean);
                    blocks.forEach(function (b, idx) { posts.push(makePost(blocks.length - idx, b)); });
                }
                return posts.filter(function (p) { return p.text; }).sort(function (a, b) { return b.id - a.id; });
            }

            function makePost(id, raw) {
                var body = raw.replace(/\n---\s*$/, '').trim();
                var m = body.match(/^###\s+(.+)\n?/);
                var date = m ? m[1].trim() : '';
                if (m) body = body.slice(m[0].length).trim();
                return { id: id, date: date, text: body };
            }

            function fmtDate(d) {
                var x = new Date(d);
                return isNaN(x) ? d : x.toLocaleString('ru-RU', { dateStyle: 'long', timeStyle: 'short' });
            }

            async function loadFromMd() {
                var r = await fetch(POSTS_URL, { cache: 'no-cache' });
                if (!r.ok) throw new Error('posts.md: HTTP ' + r.status + ' (файла нет рядом с index.html на сервере)');
                var text = await r.text();
                var posts = parsePosts(text);
                if (!posts.length) {
                    throw new Error('posts.md загружен (' + text.length + ' символов), но постов в нём нет. ' +
                        'Запустите update_posts.py или добавьте посты, разделяя их строкой ---');
                }
                return posts;
            }

            async function loadFromApi() {
                var r = await fetch(API_URL);
                if (!r.ok) throw new Error('Ошибка HTTP: ' + r.status);
                var data = await r.json();
                if (!data.success || !data.posts) return [];
                return data.posts.map(function (p, i) { return { id: i, date: '', text: p.text }; });
            }

            async function loadPosts() {
                const container = document.getElementById('telegram-feed');
                const postCount = document.getElementById('postCount');

                try {
                    var posts;
                    try { posts = await loadFromMd(); }
                    catch (mdErr) {
                        if (!USE_API_FALLBACK) throw mdErr;
                        console.warn(mdErr.message + ' — пробую запасной источник');
                        posts = await loadFromApi();
                    }

                    if (!posts.length) {
                        container.innerHTML = '<div class="loading-text">Пока нет доступных новостей.</div>';
                        postCount.textContent = '0 постов';
                        return;
                    }

                    container.innerHTML = '';
                    postCount.textContent = posts.length + ' постов';

                    posts.forEach(function (post) {
                        var card = document.createElement('div');
                        card.className = 'post-card';
                        if (post.date) {
                            var d = document.createElement('div');
                            d.className = 'post-date';
                            d.textContent = fmtDate(post.date);
                            card.appendChild(d);
                        }
                        var body = document.createElement('div');
                        body.innerHTML = renderMd(post.text);
                        card.appendChild(body);
                        container.appendChild(card);
                    });
                } catch (e) {
                    console.error('Ошибка:', e);
                    container.innerHTML = '<div class="loading-text" style="color: #ff3333;">❌ Не удалось загрузить новости.<br><small style="color: #666;"></small></div>';
                    container.querySelector('small').textContent = e.message;
                    postCount.textContent = 'Ошибка';
                }
            }

            // Запускаем загрузку
            loadPosts();

            // ===== SMOOTH SCROLL =====
            function smoothScroll(target) {
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                }
            }

            const topButton = document.getElementById('goToTopBtn');
            if (topButton) {
                topButton.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            const arrow = document.getElementById('scrollArrow');
            if (arrow) {
                arrow.addEventListener('click', function() {
                    smoothScroll(document.getElementById('about'));
                });
            }

            const logoLink = document.getElementById('logoLink');
            if (logoLink) {
                logoLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            }

            document.querySelectorAll('.nav-link, .btn--primary').forEach(link => {
                link.addEventListener('click', function(e) {
                    const targetId = this.getAttribute('href');
                    if (targetId && targetId.startsWith('#')) {
                        e.preventDefault();
                        const target = document.querySelector(targetId);
                        if (target) {
                            target.scrollIntoView({ behavior: 'smooth' });
                        }
                    }
                });
            });

            // ===== SCROLL ANIMATIONS =====
            const animatedElements = document.querySelectorAll('.animate-on-scroll');

            function checkVisibility() {
                animatedElements.forEach(el => {
                    const rect = el.getBoundingClientRect();
                    if (rect.top < window.innerHeight - 100) {
                        el.classList.add('visible');
                    }
                });
            }

            window.addEventListener('load', checkVisibility);
            window.addEventListener('scroll', checkVisibility);
            checkVisibility();

        })();
    </script>

</body>
</html>
